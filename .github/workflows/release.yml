name: Release

# Push a tag that exactly matches manifest.json's version (e.g. 0.8.1) and this
# builds the plugin, runs the tests, and publishes a GitHub release with the
# three files Obsidian installs: manifest.json, main.js, styles.css.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # attest-build-provenance signs with a short-lived OIDC token and writes
  # the attestation to the repo's attestation store.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and test
        run: |
          npm install
          npm test
          npm run build

      - name: Verify tag matches manifest version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match manifest version $version" >&2
            exit 1
          fi

      - name: Attest the release assets
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # idempotent: create the release the first time, refresh its assets on a
          # re-pushed tag instead of failing (a force-pushed tag re-runs this)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" manifest.json main.js styles.css --clobber
          else
            gh release create "$tag" --title "$tag" \
              --notes "See the README for what's included." \
              manifest.json main.js styles.css
          fi
